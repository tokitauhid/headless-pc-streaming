# SDDM Auto-Login Configuration
# Place this at /etc/sddm.conf
#
# Replace "tokit" with your username.
# Replace "hyprland" with your session name.
#
# To find available session names:
#   ls /usr/share/wayland-sessions/   (Wayland)
#   ls /usr/share/xsessions/          (X11)
#
# Common session names:
#   hyprland, plasma, gnome, gnome-wayland, sway, xfce

[Autologin]
User=tokit
Session=hyprland
